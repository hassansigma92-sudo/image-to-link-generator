<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ImgToLink - Upload & Share Images</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col justify-between">
  
  <!-- Header -->
  <header class="bg-white border-b px-6 py-4 flex justify-between items-center">
    <h1 class="text-xl font-bold text-blue-600">ImgToLink</h1>
    <button onclick="toggleAdmin(true)" class="text-sm font-medium text-gray-600 hover:text-blue-600">Admin Login</button>
  </header>

  <!-- Main Container -->
  <main class="max-w-xl mx-auto w-full p-4 flex-grow">
    
    <!-- Public Upload View -->
    <div id="public-view" class="space-y-6">
      <div class="text-center space-y-2">
        <h2 class="text-3xl font-extrabold text-gray-900">Upload & Share Images</h2>
        <p class="text-gray-500">Fast, free, and direct image links.</p>
      </div>

      <div onclick="document.getElementById('file-input').click()" class="border-2 border-dashed border-gray-300 rounded-xl p-8 text-center cursor-pointer hover:border-blue-500 bg-white">
        <input type="file" id="file-input" class="hidden" accept="image/*" onchange="handleFileSelect(event)">
        <p class="text-sm text-gray-600 font-semibold">Click to upload or drag and drop</p>
        <p class="text-xs text-gray-400 mt-1">JPG, PNG, WEBP, GIF up to 5MB</p>
      </div>

      <div id="result-box" class="hidden bg-white p-4 rounded-xl border shadow-sm space-y-3">
        <img id="preview-img" class="max-h-48 mx-auto rounded-lg object-contain" alt="Preview">
        <div class="flex gap-2">
          <input type="text" id="generated-url" readonly class="w-full bg-gray-100 p-2 text-sm rounded border">
          <button onclick="copyUrl()" class="bg-blue-600 text-white px-4 text-sm font-medium rounded">Copy</button>
        </div>
      </div>
    </div>

    <!-- Admin View -->
    <div id="admin-view" class="hidden space-y-6">
      <div id="login-card" class="bg-white p-6 rounded-xl border shadow-sm max-w-sm mx-auto space-y-4">
        <h3 class="text-lg font-bold text-center">Admin Login</h3>
        <input type="email" id="admin-email" placeholder="Email" class="w-full p-2 border rounded text-sm">
        <input type="password" id="admin-pass" placeholder="Password" class="w-full p-2 border rounded text-sm">
        <button onclick="loginAdmin()" class="w-full bg-blue-600 text-white p-2 rounded font-medium text-sm">Login</button>
        <button onclick="toggleAdmin(false)" class="w-full text-xs text-gray-500">Back to Public Site</button>
      </div>

      <div id="dashboard" class="hidden space-y-6">
        <div class="flex justify-between items-center border-b pb-2">
          <h3 class="font-bold">Admin Dashboard</h3>
          <button onclick="logoutAdmin()" class="text-xs text-red-600 font-medium">Logout</button>
        </div>
        <p class="text-sm text-gray-600">Welcome to Admin Panel!</p>
      </div>
    </div>

  </main>

  <footer class="text-center p-4 text-xs text-gray-400 border-t bg-white">
    © 2026 ImgToLink. All rights reserved.
  </footer>

  <!-- Single Clean Script Block -->
  <script>
    const SUPABASE_URL = 'https://zwtccjoxogscafkyewmn.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp3dGNjanB4b2dzY2FmeHlld25uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0MjE3NzEsImV4cCI6MjEwMzk5Nzc3MX0.6VJcQirTLbi_NeITHa7gEDgpiwrKf90yjiRficjA8LU';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function handleFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;

      const path = `uploads/${Date.now()}_${file.name}`;
      const { data, error } = await supabase.storage.from('images').upload(path, file);

      if (error) return alert('Upload Failed: ' + error.message);

      const { data: publicUrlData } = supabase.storage.from('images').getPublicUrl(path);
      const url = publicUrlData.publicUrl;

      document.getElementById('preview-img').src = url;
      document.getElementById('generated-url').value = url;
      document.getElementById('result-box').classList.remove('hidden');

      await supabase.from('uploaded_images').insert([{
        file_name: file.name,
        file_size: file.size,
        mime_type: file.type,
        public_url: url,
        storage_path: path
      }]);
    }

    function copyUrl() {
      const copyText = document.getElementById('generated-url');
      copyText.select();
      navigator.clipboard.writeText(copyText.value);
      alert('Copied link!');
    }

    function toggleAdmin(show) {
      document.getElementById('public-view').classList.toggle('hidden', show);
      document.getElementById('admin-view').classList.toggle('hidden', !show);
    }

    async function loginAdmin() {
      const email = document.getElementById('admin-email').value;
      const password = document.getElementById('admin-pass').value;

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) alert(error.message);
      else {
        document.getElementById('login-card').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
      }
    }

    async function logoutAdmin() {
      await supabase.auth.signOut();
      location.reload();
    }
  </script>
</body>
</html>
