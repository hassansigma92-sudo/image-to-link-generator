<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Image to Link Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between">
    <header class="bg-white shadow-sm border-b p-4 flex justify-between items-center max-w-5xl mx-auto w-full">
        <h1 id="site-logo-text" class="text-xl font-bold text-blue-600">ImgToLink</h1>
        <a href="#admin" onclick="toggleAdmin(true)" class="text-sm font-medium text-gray-500 hover:text-blue-600">Admin Login</a>
    </header>

    <main class="max-w-2xl mx-auto w-full p-4 flex-grow">
        <div id="public-view" class="space-y-6">
            <div class="text-center space-y-2">
                <h2 id="main-title" class="text-3xl font-extrabold text-gray-900">Upload & Share Images</h2>
                <p id="main-subtitle" class="text-gray-500">Fast, free, and direct image links.</p>
            </div>

            <div id="drop-zone" class="border-2 border-dashed border-gray-300 rounded-xl p-8 text-center bg-white hover:border-blue-500 transition cursor-pointer">
                <input type="file" id="file-input" accept="image/*" class="hidden" onchange="handleFileSelect(event)">
                <div onclick="document.getElementById('file-input').click()" class="space-y-3">
                    <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                    <p class="text-sm text-gray-600"><span class="font-semibold text-blue-600">Click to upload</span> or drag and drop</p>
                    <p class="text-xs text-gray-400">JPG, PNG, WEBP, GIF up to 5MB</p>
                </div>
            </div>

            <div id="result-box" class="hidden bg-white p-4 rounded-xl border shadow-sm space-y-3">
                <img id="preview-img" class="max-h-48 mx-auto rounded-lg object-contain" alt="Preview">
                <div class="flex gap-2">
                    <input type="text" id="generated-url" readonly class="w-full bg-gray-100 p-2 text-sm rounded border">
                    <button onclick="copyUrl()" class="bg-blue-600 text-white px-4 text-sm font-medium rounded hover:bg-blue-700">Copy</button>
                </div>
            </div>
        </div>

        <div id="admin-view" class="hidden space-y-6">
            <div id="login-card" class="bg-white p-6 rounded-xl border shadow-sm max-w-sm mx-auto space-y-4">
                <h3 class="text-lg font-bold text-center">Admin Login</h3>
                <input type="email" id="admin-email" placeholder="Email" class="w-full p-2 border rounded text-sm">
                <input type="password" id="admin-pass" placeholder="Password" class="w-full p-2 border rounded text-sm">
                <button onclick="loginAdmin()" class="w-full bg-blue-600 text-white p-2 rounded font-medium text-sm">Login</button>
                <button onclick="toggleAdmin(false)" class="w-full text-xs text-gray-500">Back to Public Site</button>
            </div>

            <div id="dashboard" class="hidden space-y-6">
                <div class="flex justify-between items-center border-b pb-2">
                    <h3 class="font-bold">Admin Dashboard</h3>
                    <button onclick="logoutAdmin()" class="text-xs text-red-600 font-medium">Logout</button>
                </div>
                <div class="bg-white p-4 rounded-xl border space-y-3">
                    <h4 class="font-semibold text-sm">Site Settings</h4>
                    <input type="text" id="setting-title" placeholder="Site Title" class="w-full p-2 border rounded text-sm">
                    <input type="text" id="setting-subtitle" placeholder="Site Subtitle" class="w-full p-2 border rounded text-sm">
                    <button onclick="saveSettings()" class="bg-green-600 text-white px-4 py-2 rounded text-sm font-medium">Save Settings</button>
                </div>
            </div>
        </div>
    </main>

    <footer id="footer-text" class="text-center p-4 text-xs text-gray-400 border-t bg-white">
        © 2026 ImgToLink. All rights reserved.
    </footer>

  <!-- Supabase CDN Script Link -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL = 'https://zwtccjoxogscafkyewmn.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp3dGNjanB4b2dzY2FmeHlld25uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0MjE3NzEsImV4cCI6MjEwMzk5Nzc3MX0.6VJcQirTLbi_NeITHa7gEDgpiwrKf90yjiRficjA8LU';

  // Correct CDN Initialization
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;
            const path = `uploads/${Date.now()}_${file.name}`;
            const { data, error } = await supabase.storage.from('images').upload(path, file);
            if (error) return alert('Upload Failed: ' + error.message);
            
            const { data: publicUrlData } = supabase.storage.from('images').getPublicUrl(path);
            const url = publicUrlData.publicUrl;
            
            document.getElementById('preview-img').src = url;
            document.getElementById('generated-url').value = url;
            document.getElementById('result-box').classList.remove('hidden');

            await supabase.from('uploaded_images').insert([{
                file_name: file.name, file_size: file.size, mime_type: file.type, public_url: url, storage_path: path
            }]);
        }

        function copyUrl() {
            const copyText = document.getElementById("generated-url");
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            alert("Copied link!");
        }

        function toggleAdmin(show) {
            document.getElementById('public-view').classList.toggle('hidden', show);
            document.getElementById('admin-view').classList.toggle('hidden', !show);
        }

        async function loginAdmin() {
            const email = document.getElementById('admin-email').value;
            const password = document.getElementById('admin-pass').value;
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) alert(error.message);
            else {
                document.getElementById('login-card').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
            }
        }

        async function logoutAdmin() {
            await supabase.auth.signOut();
            location.reload();
        }
    </script>
</body>
</html>
